<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adairway — GPS & API Course Builder Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fairway-deep:#1F3A2E;
    --turf:#3F6B4A;
    --paper:#EDE6D6;
    --paper-light:#F5F0E6;
    --graphite:#33312C;
    --flag:#A4402F;
    --sand:#C7A876;
    --sky:#8FA89A;
    --line:#D7CCB0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--graphite);
    font-family:'Inter',sans-serif;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(51,49,44,0.035) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(51,49,44,0.035) 28px);
  }
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;}

  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    border-bottom:3px solid var(--fairway-deep);
    padding-bottom:14px;margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  h1{
    font-family:'Fraunces',serif;font-weight:700;font-size:30px;
    margin:0;color:var(--fairway-deep);
  }
  .tag{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--turf);font-weight:600;}

  nav{display:flex;gap:2px;margin-bottom:22px;flex-wrap:wrap;}
  nav button{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;
    text-transform:uppercase;background:none;border:none;color:var(--graphite);opacity:0.55;
    padding:9px 14px;cursor:pointer;position:relative;
  }
  nav button.active{opacity:1;color:var(--fairway-deep);}
  nav button.active::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--flag);}

  section{display:none;}
  section.active{display:block;}

  .card{
    background:var(--paper-light);border:1px solid var(--line);border-radius:3px;
    padding:20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(31,58,46,0.04);
  }
  .card h2{
    font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0 0 14px;color:var(--fairway-deep);
  }

  label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;color:var(--turf);margin-bottom:4px;}
  input[type=text], input[type=number], select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:2px;
    background:#fff;font-family:'Inter',sans-serif;font-size:14px;color:var(--graphite);
  }
  .field{margin-bottom:12px;}

  button.btn{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;text-transform:uppercase;
    background:var(--fairway-deep);color:var(--paper-light);border:none;border-radius:2px;
    padding:10px 18px;cursor:pointer;
  }
  button.btn:hover{background:var(--turf);}
  button.btn.secondary{background:var(--turf);}
  button.btn.small{padding:4px 8px;font-size:11px;}

  /* GPS Widget */
  .gps-box{
    background:var(--fairway-deep);color:var(--paper-light);padding:14px;border-radius:4px;
    text-align:center;margin-bottom:16px;font-family:'IBM Plex Mono',monospace;
  }
  .gps-values{display:flex;justify-content:space-around;margin-top:8px;}
  .gps-val{font-size:24px;font-weight:700;color:#fff;}
  .gps-label{font-size:10px;text-transform:uppercase;opacity:0.8;}

  .hole-card{text-align:center;padding:8px 0 4px;}
  .stepper{display:flex;align-items:center;justify-content:center;gap:22px;}
  .stepper button{
    width:52px;height:52px;border-radius:50%;border:2px solid var(--fairway-deep);background:var(--paper-light);
    color:var(--fairway-deep);font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;cursor:pointer;
  }
  .stepper .val{font-family:'Fraunces',serif;font-weight:700;font-size:38px;color:var(--graphite);min-width:52px;}

  /* API Search Results */
  .api-result-item{
    border:1px solid var(--line);background:#fff;padding:10px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;
  }

  /* Setup table */
  .setup-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .setup-table th, .setup-table td{border:1px solid var(--line);padding:6px;text-align:center;}
  .setup-table th{background:var(--fairway-deep);color:#fff;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div>
        <h1>Adairway GPS</h1>
        <div class="tag">Course Creator & OpenGolfAPI Test</div>
      </div>
    </div>
  </header>

  <nav id="tabs">
    <button data-tab="play" class="active">▶ Play &amp; GPS</button>
    <button data-tab="builder">⚙ Course Builder</button>
  </nav>

  <!-- PLAY & GPS TAB -->
  <section id="tab-play" class="active">
    <div class="card">
      <h2>Active Round</h2>
      <div class="field">
        <label>Select Course</label>
        <select id="pl-preset">
          <option value="">— Select Course —</option>
        </select>
      </div>
    </div>

    <!-- LIVE GPS DISPLAY -->
    <div class="gps-box" id="gpsBox">
      <div style="font-size:11px;letter-spacing:0.05em;color:var(--sky);">LIVE GREEN DISTANCE</div>
      <div class="gps-values">
        <div>
          <div class="gps-label">Front</div>
          <div class="gps-val" id="gpsFront">---</div>
        </div>
        <div>
          <div class="gps-label">Back</div>
          <div class="gps-val" id="gpsBack">---</div>
        </div>
      </div>
      <div id="gpsStatus" style="font-size:10px;margin-top:8px;opacity:0.7;">Select a course to enable GPS</div>
    </div>

    <!-- HOLE TRACKING -->
    <div class="card">
      <div class="hole-card">
        <h2 id="playHoleNum" style="justify-content:center;margin:0;">Hole 1</h2>
        <div id="playHolePar" style="font-family:'IBM Plex Mono',monospace;font-size:13px;opacity:0.7;margin-bottom:12px;">Par 4</div>
      </div>

      <div style="margin-bottom:20px;">
        <div style="text-align:center;font-size:11px;font-weight:600;color:var(--turf);margin-bottom:6px;">SCORE</div>
        <div class="stepper">
          <button id="scoreMinus" type="button">−</button>
          <div class="val" id="scoreVal">4</div>
          <button id="scorePlus" type="button">+</button>
        </div>
      </div>

      <div style="display:flex;gap:10px;">
        <button class="btn" id="playPrev" style="flex:1;">← Prev Hole</button>
        <button class="btn" id="playNext" style="flex:1;">Next Hole →</button>
      </div>

      <!-- Quick GPS Pin Calibration -->
      <div style="margin-top:20px;border-top:1px dashed var(--line);padding-top:12px;text-align:center;">
        <div style="font-size:11px;color:var(--turf);margin-bottom:6px;font-weight:600;">STAND AT GREEN &amp; MARK GPS PIN</div>
        <button class="btn small secondary" id="markFrontBtn">Mark Front Here</button>
        <button class="btn small secondary" id="markBackBtn">Mark Back Here</button>
      </div>
    </div>
  </section>

  <!-- COURSE BUILDER TAB -->
  <section id="tab-builder">
    <!-- OPENGOLFAPI SEARCH -->
    <div class="card">
      <h2>Search OpenGolfAPI</h2>
      <div style="display:flex;gap:10px;">
        <input type="text" id="apiSearchInput" placeholder="Enter course name (e.g. Emerald Valley)">
        <button class="btn" id="apiSearchBtn">Search</button>
      </div>
      <div id="apiSearchResults" style="margin-top:12px;"></div>
    </div>

    <div class="card">
      <h2>Course Details &amp; Pin Setup</h2>
      <div class="field">
        <label>Course Name</label>
        <input type="text" id="newCourseName" placeholder="e.g. Shadow Hills Country Club">
      </div>

      <table class="setup-table">
        <thead>
          <tr>
            <th>Hole</th><th>Par</th><th>Front Lat</th><th>Front Lng</th><th>Back Lat</th><th>Back Lng</th>
          </tr>
        </thead>
        <tbody id="builderTableBody"></tbody>
      </table>

      <button class="btn" id="saveNewCourseBtn">Save Course to Presets</button>
    </div>
  </section>

</div>

<script>
// ---------- BASE PRESETS ----------
const DEFAULT_PRESETS = {
  "Pine Ridge Golf Club": {
    pars: [5,4,4,3,4,4,4,5,4, 3,5,4,4,4,3,4,3,5],
    coords: {}
  },
  "Eugene Country Club": {
    pars: [4,3,4,4,3,5,3,5,4, 4,4,3,5,4,4,5,4,4],
    coords: {}
  }
};

let currentHole = 0;
let playHoles = Array.from({length:18}, (_,i)=>({hole:i+1, par:4, score:4}));
let watchId = null;

// Storage Helper
function getCustomCourses(){
  try { return JSON.parse(localStorage.getItem('adairway:custom_courses')) || {}; }
  catch(e){ return {}; }
}
function saveCustomCourses(data){
  localStorage.setItem('adairway:custom_courses', JSON.stringify(data));
}

function getAllCourses(){
  return { ...DEFAULT_PRESETS, ...getCustomCourses() };
}

// Populate Course Selector
function populateDropdown(){
  const sel = document.getElementById('pl-preset');
  sel.innerHTML = '<option value="">— Select Course —</option>';
  const courses = getAllCourses();
  Object.keys(courses).forEach(name=>{
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
}

// Distance Calculation (Haversine formula to yards)
function getDistanceYards(lat1, lon1, lat2, lon2) {
  if (!lat1 || !lon1 || !lat2 || !lon2) return null;
  const R = 6371e3;
  const rad = Math.PI / 180;
  const φ1 = lat1 * rad, φ2 = lat2 * rad;
  const Δφ = (lat2 - lat1) * rad;
  const Δλ = (lon2 - lon1) * rad;

  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return Math.round((R * c) * 1.09361);
}

// GPS Engine
function updateGPS(){
  const courseName = document.getElementById('pl-preset').value;
  const statusEl = document.getElementById('gpsStatus');
  const frontEl = document.getElementById('gpsFront');
  const backEl = document.getElementById('gpsBack');

  if(!courseName){
    statusEl.textContent = 'Select a course above to start GPS';
    frontEl.textContent = '---'; backEl.textContent = '---';
    if(watchId){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    return;
  }

  const all = getAllCourses();
  const course = all[courseName];
  const holeCoords = course?.coords?.[currentHole + 1];

  if (!navigator.geolocation) {
    statusEl.textContent = 'Geolocation is not supported by your browser';
    return;
  }

  statusEl.textContent = 'Locating...';

  if(watchId) navigator.geolocation.clearWatch(watchId);

  watchId = navigator.geolocation.watchPosition((pos) => {
    const uLat = pos.coords.latitude;
    const uLng = pos.coords.longitude;

    statusEl.textContent = `Live GPS Active (Accuracy: ~${Math.round(pos.coords.accuracy)}m)`;

    if(holeCoords?.front?.lat){
      const dFront = getDistanceYards(uLat, uLng, holeCoords.front.lat, holeCoords.front.lng);
      frontEl.textContent = dFront !== null ? `${dFront} yds` : '---';
    } else {
      frontEl.textContent = 'No Pin';
    }

    if(holeCoords?.back?.lat){
      const dBack = getDistanceYards(uLat, uLng, holeCoords.back.lat, holeCoords.back.lng);
      backEl.textContent = dBack !== null ? `${dBack} yds` : '---';
    } else {
      backEl.textContent = 'No Pin';
    }
  }, (err) => {
    statusEl.textContent = 'GPS Error: ' + err.message;
  }, { enableHighAccuracy: true, maximumAge: 1000 });
}

// Render Hole View
function renderHole(){
  const h = playHoles[currentHole];
  document.getElementById('playHoleNum').textContent = 'Hole ' + h.hole;
  document.getElementById('playHolePar').textContent = 'Par ' + h.par;
  document.getElementById('scoreVal').textContent = h.score;

  document.getElementById('playPrev').disabled = (currentHole === 0);
  document.getElementById('playNext').disabled = (currentHole === 17);

  updateGPS();
}

// Course Builder Setup Table
function renderBuilderTable(data = null){
  const body = document.getElementById('builderTableBody');
  let html = '';
  for(let i = 1; i <= 18; i++){
    const par = data?.pars?.[i-1] || 4;
    const fLat = data?.coords?.[i]?.front?.lat || '';
    const fLng = data?.coords?.[i]?.front?.lng || '';
    const bLat = data?.coords?.[i]?.back?.lat || '';
    const bLng = data?.coords?.[i]?.back?.lng || '';

    html += `<tr>
      <td><b>${i}</b></td>
      <td><input type="number" class="b-par" data-hole="${i}" value="${par}" min="3" max="6" style="width:45px;"></td>
      <td><input type="number" step="any" class="b-flat" data-hole="${i}" value="${fLat}" placeholder="lat" style="width:80px;"></td>
      <td><input type="number" step="any" class="b-flng" data-hole="${i}" value="${fLng}" placeholder="lng" style="width:80px;"></td>
      <td><input type="number" step="any" class="b-blat" data-hole="${i}" value="${bLat}" placeholder="lat" style="width:80px;"></td>
      <td><input type="number" step="any" class="b-blng" data-hole="${i}" value="${bLng}" placeholder="lng" style="width:80px;"></td>
    </tr>`;
  }
  body.innerHTML = html;
}

// OPENGOLFAPI SEARCH ENGINE
document.getElementById('apiSearchBtn').addEventListener('click', async () => {
  const query = document.getElementById('apiSearchInput').value.trim();
  const resultsEl = document.getElementById('apiSearchResults');
  if(!query) return;

  resultsEl.innerHTML = '<div style="font-size:12px;opacity:0.7;">Searching OpenGolfAPI...</div>';

  try {
    const res = await fetch(`https://api.opengolfapi.org/v1/courses/search?q=${encodeURIComponent(query)}`);
    const data = await res.json();
    const courses = data.courses || data.data || [];

    if(courses.length === 0){
      resultsEl.innerHTML = '<div style="font-size:12px;color:var(--flag);">No courses found. Try another search.</div>';
      return;
    }

    resultsEl.innerHTML = courses.slice(0, 5).map((c, idx) => `
      <div class="api-result-item">
        <div>
          <div style="font-weight:600;font-size:13px;">${c.name}</div>
          <div style="font-size:11px;opacity:0.7;">${c.city || ''}, ${c.state || c.country || ''} · ${c.holes_count || 18} holes</div>
        </div>
        <button class="btn small" onclick="importApiCourse(${idx})">Import</button>
      </div>
    `).join('');

    window._apiCourseCache = courses;
  } catch(err) {
    resultsEl.innerHTML = `<div style="font-size:12px;color:var(--flag);">API Error: ${err.message}</div>`;
  }
});

// IMPORT API COURSE DATA
window.importApiCourse = function(idx) {
  const c = window._apiCourseCache?.[idx];
  if(!c) return;

  document.getElementById('newCourseName').value = c.name;

  const pars = [];
  const coords = {};

  const holesData = c.holes || Array.from({length:18}, (_,i)=>({hole_number:i+1, par:4}));

  holesData.forEach(h => {
    const hNum = h.hole_number || h.number;
    pars.push(h.par || 4);

    // If API returns green center, project front and back pins (~15 yds offset)
    if(h.green_lat && h.green_lng){
      const lat = parseFloat(h.green_lat);
      const lng = parseFloat(h.green_lng);
      const offset = 0.00013; // Approx 15 yards in lat/lng degrees

      coords[hNum] = {
        front: { lat: lat - offset, lng: lng - offset },
        back:  { lat: lat + offset, lng: lng + offset }
      };
    }
  });

  renderBuilderTable({ pars, coords });
  alert(`Imported "${c.name}" into the form below! Review and hit "Save Course to Presets".`);
};

// Save Custom Course
document.getElementById('saveNewCourseBtn').addEventListener('click', ()=>{
  const name = document.getElementById('newCourseName').value.trim();
  if(!name){ alert('Please give the course a name.'); return; }

  const pars = [];
  const coords = {};

  for(let i = 1; i <= 18; i++){
    const parVal = +document.querySelector(`.b-par[data-hole="${i}"]`).value || 4;
    pars.push(parVal);

    const fLat = parseFloat(document.querySelector(`.b-flat[data-hole="${i}"]`).value);
    const fLng = parseFloat(document.querySelector(`.b-flng[data-hole="${i}"]`).value);
    const bLat = parseFloat(document.querySelector(`.b-blat[data-hole="${i}"]`).value);
    const bLng = parseFloat(document.querySelector(`.b-blng[data-hole="${i}"]`).value);

    coords[i] = {
      front: (!isNaN(fLat) && !isNaN(fLng)) ? { lat: fLat, lng: fLng } : null,
      back: (!isNaN(bLat) && !isNaN(bLng)) ? { lat: bLat, lng: bLng } : null
    };
  }

  const custom = getCustomCourses();
  custom[name] = { pars, coords };
  saveCustomCourses(custom);

  populateDropdown();
  alert(`Course "${name}" saved!`);
  document.getElementById('newCourseName').value = '';
});

// Mark Current GPS Location Directly
function markCurrentLocation(type){
  const courseName = document.getElementById('pl-preset').value;
  if(!courseName){ alert('Select a course first.'); return; }

  if(!navigator.geolocation){ alert('GPS unavailable'); return; }

  navigator.geolocation.getCurrentPosition((pos)=>{
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    const custom = getCustomCourses();
    const all = getAllCourses();

    if(!custom[courseName]){
      custom[courseName] = all[courseName] || { pars: playHoles.map(h=>h.par), coords: {} };
    }

    if(!custom[courseName].coords) custom[courseName].coords = {};
    if(!custom[courseName].coords[currentHole + 1]) custom[courseName].coords[currentHole + 1] = { front: null, back: null };

    custom[courseName].coords[currentHole + 1][type] = { lat, lng };
    saveCustomCourses(custom);

    alert(`Saved current location as ${type.toUpperCase()} for Hole ${currentHole + 1}`);
    updateGPS();
  }, (err) => alert('Error getting GPS location: ' + err.message), { enableHighAccuracy: true });
}

document.getElementById('markFrontBtn').addEventListener('click', () => markCurrentLocation('front'));
document.getElementById('markBackBtn').addEventListener('click', () => markCurrentLocation('back'));

// Event Listeners
document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
});

document.getElementById('pl-preset').addEventListener('change', (e)=>{
  const name = e.target.value;
  if(!name) return;
  const all = getAllCourses();
  const pars = all[name].pars;
  pars.forEach((p,i)=>{ playHoles[i].par = p; playHoles[i].score = p; });
  renderHole();
});

document.getElementById('scoreMinus').addEventListener('click', ()=>{
  playHoles[currentHole].score = Math.max(1, playHoles[currentHole].score - 1);
  renderHole();
});
document.getElementById('scorePlus').addEventListener('click', ()=>{
  playHoles[currentHole].score++;
  renderHole();
});
document.getElementById('playPrev').addEventListener('click', ()=>{
  if(currentHole > 0){ currentHole--; renderHole(); }
});
document.getElementById('playNext').addEventListener('click', ()=>{
  if(currentHole < 17){ currentHole++; renderHole(); }
});

// Initialize
populateDropdown();
renderHole();
renderBuilderTable();
</script>
</body>
</html>
