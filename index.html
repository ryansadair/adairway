<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adairway — Golf Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fairway-deep:#1F3A2E;
    --turf:#3F6B4A;
    --paper:#EDE6D6;
    --paper-light:#F5F0E6;
    --graphite:#33312C;
    --flag:#A4402F;
    --sand:#C7A876;
    --sky:#8FA89A;
    --line:#D7CCB0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--graphite);
    font-family:'Inter',sans-serif;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(51,49,44,0.035) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(51,49,44,0.035) 28px);
  }
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;display:block;}

  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    border-bottom:3px solid var(--fairway-deep);
    padding-bottom:14px;margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .flagmark{width:34px;height:34px;flex-shrink:0;}
  h1{
    font-family:'Fraunces',serif;font-weight:700;font-size:30px;
    letter-spacing:-0.01em;margin:0;color:var(--fairway-deep);
  }
  .tag{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--turf);font-weight:600;}
  .today{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--graphite);opacity:0.7;text-align:right;}

  nav{display:flex;gap:2px;margin-bottom:22px;flex-wrap:wrap;}
  nav button{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:0.04em;
    text-transform:uppercase;background:none;border:none;color:var(--graphite);opacity:0.55;
    padding:9px 14px;cursor:pointer;position:relative;transition:opacity .15s;
  }
  nav button:hover{opacity:0.85;}
  nav button.active{opacity:1;color:var(--fairway-deep);}
  nav button.active::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--flag);}
  nav button .peg{
    display:inline-block;width:16px;height:16px;border-radius:50%;
    background:var(--fairway-deep);color:var(--paper-light);font-size:9px;line-height:16px;text-align:center;margin-right:6px;
  }

  section{display:none;}
  section.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{
    background:var(--paper-light);border:1px solid var(--line);border-radius:3px;
    padding:20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(31,58,46,0.04);
  }
  .card h2{
    font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0 0 14px;color:var(--fairway-deep);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .card h2 small{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:var(--turf);text-transform:none;}

  label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--turf);margin-bottom:4px;}
  input[type=text], input[type=password], input[type=date], input[type=number], textarea, select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:2px;
    background:#fff;font-family:'Inter',sans-serif;font-size:14px;color:var(--graphite);
  }
  input:focus, textarea:focus, select:focus{outline:2px solid var(--sky);outline-offset:0;border-color:var(--turf);}
  textarea{resize:vertical;min-height:60px;font-family:'Inter',sans-serif;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .field{margin-bottom:12px;}

  button.btn{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:0.05em;
    background:var(--fairway-deep);color:var(--paper-light);border:none;border-radius:2px;
    padding:10px 18px;cursor:pointer;transition:background .15s;
  }
  button.btn:hover{background:var(--turf);}
  button.btn.small{padding:5px 10px;font-size:11px;}
  button.btn.outline{background:none;color:var(--fairway-deep);border:2px solid var(--fairway-deep);}
  button.btn.outline:hover{background:var(--fairway-deep);color:var(--paper-light);}

  .scorecard{overflow-x:auto;margin-bottom:14px;border:1px solid var(--fairway-deep);border-radius:2px;}
  table.sc{border-collapse:collapse;width:100%;min-width:650px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  table.sc th, table.sc td{border:1px solid var(--line);padding:4px 2px;text-align:center;}
  table.sc th{background:var(--fairway-deep);color:var(--paper-light);font-weight:600;font-size:10.5px;}
  table.sc td.rowlabel{background:var(--sand);color:var(--graphite);font-weight:700;text-align:left;padding-left:8px;width:64px;font-size:10.5px;}
  table.sc td.front9{background:rgba(63,107,74,0.06);}
  table.sc td.back9{background:rgba(164,64,47,0.05);}
  table.sc input[type=number]{
    width:32px;border:none;background:transparent;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:3px 0;
  }
  table.sc input[type=checkbox]{width:15px;height:15px;cursor:pointer;}
  table.sc td.total{background:var(--fairway-deep);color:var(--paper-light);font-weight:700;font-size:11.5px;}

  .preset-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;}
  .preset-row .field{flex:1;min-width:220px;margin-bottom:0;}

  .list-item{
    border:1px solid var(--line);border-radius:2px;padding:12px 14px;margin-bottom:8px;background:#fff;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  }
  .empty{
    text-align:center;padding:34px 20px;color:var(--turf);font-family:'IBM Plex Mono',monospace;font-size:13px;
    border:1px dashed var(--line);border-radius:3px;
  }

  .del{background:none;border:none;color:var(--flag);cursor:pointer;font-size:12px;font-family:'IBM Plex Mono',monospace;padding:2px 6px;}
  .del:hover{text-decoration:underline;}

  .hole-card{text-align:center;padding:8px 0 4px;}
  .hole-card .holenum{font-family:'Fraunces',serif;font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:0.08em;color:var(--turf);margin-bottom:2px;}
  .hole-card .holepar{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--graphite);opacity:0.8;margin-bottom:14px;}
  .stat-block{margin-bottom:22px;}
  .stat-block .stat-name{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--turf);font-weight:600;margin-bottom:8px;}
  .stepper{display:flex;align-items:center;justify-content:center;gap:22px;}
  .stepper button{
    width:52px;height:52px;border-radius:50%;border:2px solid var(--fairway-deep);background:var(--paper-light);
    color:var(--fairway-deep);font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;user-select:none;
  }
  .stepper button:active{background:var(--fairway-deep);color:var(--paper-light);}
  .stepper .val{font-family:'Fraunces',serif;font-weight:700;font-size:38px;color:var(--graphite);min-width:52px;}
  .toggle-btn{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.04em;
    padding:14px 20px;border-radius:3px;border:2px solid var(--line);background:#fff;color:var(--graphite);
    cursor:pointer;width:100%;transition:all .12s;
  }
  .toggle-btn.on{background:var(--turf);border-color:var(--turf);color:#fff;}
  .toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .play-nav{display:flex;gap:10px;margin-top:18px;}
  .play-nav button{flex:1;}

  .gps-box {
    background: var(--fairway-deep);
    color: var(--paper-light);
    padding: 12px;
    border-radius: 3px;
    text-align: center;
    margin-bottom: 16px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .gps-dist {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
  }
  .api-result-item {
    border: 1px solid var(--line);
    padding: 10px;
    margin-top: 8px;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  @media (max-width: 520px){
    .wrap{padding:16px 14px 70px;}
    header{flex-direction:column;align-items:flex-start;gap:6px;padding-bottom:10px;}
    .today{text-align:left;}
    h1{font-size:26px;}
    .grid3, .grid2{grid-template-columns:1fr;}
    nav{gap:0;margin-bottom:16px;}
    nav button{padding:8px 10px;font-size:11.5px;}
    .stepper{gap:14px;}
    .stepper button{width:46px;height:46px;font-size:22px;}
  }
</style>
</head>
<body>

<!-- MAIN APP CONTAINER -->
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="flagmark" viewBox="0 0 40 40" fill="none">
        <line x1="10" y1="4" x2="10" y2="36" stroke="#1F3A2E" stroke-width="2"/>
        <path d="M10 5 L28 10 L10 15 Z" fill="#A4402F"/>
        <ellipse cx="10" cy="37" rx="7" ry="2" fill="#8FA89A" opacity="0.5"/>
      </svg>
      <div>
        <h1>Adairway</h1>
        <div class="tag">Personal course log</div>
      </div>
    </div>
    <div class="today" id="todayDate"></div>
  </header>

  <nav id="tabs">
    <button data-tab="play"><span class="peg">▶</span>Play</button>
    <button data-tab="rounds" class="active"><span class="peg">1</span>Rounds</button>
    <button data-tab="stats"><span class="peg">2</span>Stats</button>
    <button data-tab="practice"><span class="peg">3</span>Practice</button>
    <button data-tab="bag"><span class="peg">4</span>Bag</button>
    <button data-tab="courses"><span class="peg">5</span>Courses</button>
    <button data-tab="notes"><span class="peg">6</span>Notes</button>
    <button data-tab="backup"><span class="peg">7</span>Backup</button>
  </nav>

  <!-- PLAY -->
  <section id="tab-play">
    <div class="card">
      <h2>Playing now</h2>
      <div class="preset-row">
        <div class="field">
          <label>Quick-load a course</label>
          <select id="pl-preset">
            <option value="">— Select a regular —</option>
          </select>
        </div>
      </div>
      <div class="grid3">
        <div class="field"><label>Date</label><input type="date" id="pl-date"></div>
        <div class="field"><label>Course</label><input type="text" id="pl-course" placeholder="e.g. Pine Ridge Golf Club"></div>
        <div class="field"><label>Tees</label><input type="text" id="pl-tees" placeholder="e.g. White"></div>
      </div>
    </div>

    <!-- GPS RANGEFINDER -->
    <div class="card">
      <h2>Live Green GPS</h2>
      <div class="gps-box">
        <div style="font-size: 11px; text-transform: uppercase; opacity:0.8;">Distance to Center</div>
        <div class="gps-dist" id="gpsDisplay">-- yds</div>
        <button class="btn outline small" id="gpsBtn" style="margin-top: 8px; color: #fff; border-color: #fff;">Get Distance</button>
      </div>
    </div>

    <div class="card">
      <div class="hole-card">
        <div class="holenum" id="playHoleNum">Hole 1</div>
        <div class="holepar" id="playHolePar">Par 4 &bull; <span id="playHoleYards">-- yds</span></div>
      </div>

      <div class="stat-block">
        <div class="stat-name" style="text-align:center;">Score</div>
        <div class="stepper">
          <button id="scoreMinus" type="button">−</button>
          <div class="val" id="scoreVal">4</div>
          <button id="scorePlus" type="button">+</button>
        </div>
      </div>

      <div class="stat-block">
        <div class="stat-name" style="text-align:center;">Putts</div>
        <div class="stepper">
          <button id="puttsMinus" type="button">−</button>
          <div class="val" id="puttsVal">2</div>
          <button id="puttsPlus" type="button">+</button>
        </div>
      </div>

      <div class="stat-block">
        <div class="toggle-row">
          <button class="toggle-btn" id="firToggle" type="button">Fairway hit</button>
          <button class="toggle-btn" id="girToggle" type="button">Green in reg</button>
        </div>
      </div>

      <div class="play-nav">
        <button class="btn outline" id="playPrev" type="button">← Prev</button>
        <button class="btn outline" id="playNext" type="button">Next →</button>
      </div>
    </div>

    <div class="card">
      <div class="field"><label>Notes</label><textarea id="pl-notes" placeholder="Anything worth remembering..."></textarea></div>
      <button class="btn" id="finishRoundBtn" style="width:100%;">Finish &amp; save round</button>
    </div>
  </section>

  <!-- ROUNDS -->
  <section id="tab-rounds" class="active">
    <div class="card">
      <h2>New round</h2>
      <div class="preset-row">
        <div class="field">
          <label>Quick-load a course</label>
          <select id="r-preset">
            <option value="">— Select a regular —</option>
          </select>
        </div>
        <div class="field" style="max-width: 140px;">
          <label>Holes</label>
          <select id="r-holes">
            <option value="18" selected>18 Holes</option>
            <option value="9">9 Holes</option>
          </select>
        </div>
      </div>
      <div class="grid3">
        <div class="field"><label>Date</label><input type="date" id="r-date"></div>
        <div class="field"><label>Course</label><input type="text" id="r-course" placeholder="e.g. Pine Ridge Golf Club"></div>
        <div class="field"><label>Tees</label><input type="text" id="r-tees" placeholder="e.g. White"></div>
      </div>
      <div class="scorecard">
        <table class="sc" id="scorecardTable"></table>
      </div>
      <div class="field"><label>Notes</label><textarea id="r-notes" placeholder="Ball striking, misses, mental game..."></textarea></div>
      <button class="btn" id="saveRoundBtn">Save round</button>
    </div>

    <div class="card">
      <h2>Round history</h2>
      <div id="roundsList"></div>
    </div>
  </section>

  <!-- STATS -->
  <section id="tab-stats">
    <div class="card">
      <h2>Season at a glance</h2>
      <div class="stat-row" id="statBoxes"></div>
    </div>
  </section>

  <!-- PRACTICE -->
  <section id="tab-practice">
    <div class="card">
      <h2>Log practice session</h2>
      <div class="grid3">
        <div class="field"><label>Date</label><input type="date" id="p-date"></div>
        <div class="field"><label>Focus area</label><input type="text" id="p-focus" placeholder="e.g. Putting"></div>
        <div class="field"><label>Duration (min)</label><input type="number" id="p-duration" min="0"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="p-notes"></textarea></div>
      <button class="btn" id="savePracticeBtn">Save session</button>
    </div>
  </section>

  <!-- BAG -->
  <section id="tab-bag">
    <div class="card">
      <h2>Add a club</h2>
      <div class="grid3">
        <div class="field"><label>Club</label><input type="text" id="c-name"></div>
        <div class="field"><label>Brand / Model</label><input type="text" id="c-model"></div>
        <div class="field"><label>Shaft</label><input type="text" id="c-shaft"></div>
      </div>
      <button class="btn" id="saveClubBtn">Add club</button>
    </div>
  </section>

  <!-- COURSES -->
  <section id="tab-courses">
    <!-- OPENGOLFAPI SEARCH CARD -->
    <div class="card">
      <h2>Search OpenGolfAPI</h2>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="text" id="apiSearchInput" placeholder="Search course name or city/state...">
        <button class="btn" id="apiSearchBtn">Search</button>
      </div>
      <div id="apiSearchResults" style="margin-top: 12px;"></div>
    </div>

    <div class="card">
      <h2>Add course notes</h2>
      <div class="field"><label>Course name</label><input type="text" id="co-name"></div>
      <div class="grid2">
        <div class="field"><label>Course Rating</label><input type="number" step="0.1" id="co-rating" placeholder="72.0"></div>
        <div class="field"><label>Slope Rating</label><input type="number" id="co-slope" placeholder="113"></div>
      </div>
      <input type="hidden" id="co-api-id">
      <button class="btn" id="saveCourseBtn">Save course</button>
    </div>

    <div class="card">
      <h2>Saved Courses</h2>
      <div id="coursesList"></div>
    </div>
  </section>

  <!-- NOTES -->
  <section id="tab-notes">
    <div class="card">
      <h2>Journal entry</h2>
      <div class="field"><label>Date</label><input type="date" id="n-date"></div>
      <div class="field"><label>Thought</label><textarea id="n-text"></textarea></div>
      <button class="btn" id="saveNoteBtn">Add entry</button>
    </div>
  </section>

  <!-- BACKUP -->
  <section id="tab-backup">
    <div class="card">
      <h2>Export / Restore</h2>
      <button class="btn" id="exportBtn">Download backup (.json)</button>
    </div>
  </section>

</div>

<script>
// ---------- Local Data Store & Setup ----------
const OGA_BASE = 'https://api.opengolfapi.org';
let activeCourseApiId = null;
let currentLoadedPars = Array(18).fill(4);
let currentLoadedYards = Array(18).fill(0);
let currentLoadedGreenCoords = Array(18).fill(null);
let currentPlayHole = 1;

let savedCourses = JSON.parse(localStorage.getItem('adairway_courses') || '[]');

const todayISO = () => new Date().toISOString().slice(0,10);
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
document.getElementById('r-date').value = todayISO();
document.getElementById('p-date').value = todayISO();
document.getElementById('n-date').value = todayISO();
document.getElementById('pl-date').value = todayISO();

// ---------- SCORECARD PAR, YARDAGE & GPS POPULATION ----------
function applyScorecardData(pars, yards, coords) {
  if (pars && pars.length) {
    currentLoadedPars = pars;
    for (let i = 1; i <= 18; i++) {
      const parInput = document.getElementById(`par_${i}`);
      if (parInput && pars[i - 1] !== undefined) {
        parInput.value = pars[i - 1];
      }
    }
  }
  if (yards && yards.length) {
    currentLoadedYards = yards;
    for (let i = 1; i <= 18; i++) {
      const ydInput = document.getElementById(`yd_${i}`);
      if (ydInput && yards[i - 1] !== undefined) {
        ydInput.value = yards[i - 1];
      }
    }
  }
  if (coords && coords.length) {
    currentLoadedGreenCoords = coords;
  } else {
    currentLoadedGreenCoords = Array(18).fill(null);
  }
  
  updateTotals();
  updatePlayHoleUI();
}

function updatePlayHoleUI() {
  document.getElementById('playHoleNum').textContent = `Hole ${currentPlayHole}`;
  document.getElementById('playHolePar').innerHTML = `Par ${currentLoadedPars[currentPlayHole - 1] || 4} &bull; <span>${currentLoadedYards[currentPlayHole - 1] || '--'} yds</span>`;
  document.getElementById('gpsDisplay').textContent = '-- yds';
}

// ---------- COURSE SAVING & DROPDOWN SYNC ----------
function updateCourseDropdowns() {
  const rPreset = document.getElementById('r-preset');
  const plPreset = document.getElementById('pl-preset');
  const coursesList = document.getElementById('coursesList');

  const optionsHTML = '<option value="">— Select a regular —</option>' + 
    savedCourses.map((c, idx) => `<option value="${idx}">${c.name}</option>`).join('');

  if(rPreset) rPreset.innerHTML = optionsHTML;
  if(plPreset) plPreset.innerHTML = optionsHTML;

  if(coursesList) {
    if(savedCourses.length === 0) {
      coursesList.innerHTML = '<div class="empty">No courses saved yet.</div>';
    } else {
      coursesList.innerHTML = savedCourses.map((c, index) => {
        const totalYds = c.yards ? c.yards.reduce((a, b) => a + (parseInt(b)||0), 0) : 0;
        return `
          <div class="list-item">
            <div>
              <strong>${c.name}</strong><br>
              <small style="color:var(--turf);">Rating: ${c.rating || '--'} | Slope: ${c.slope || '--'} ${totalYds ? '| Total Yards: ' + totalYds : ''}</small>
            </div>
            <button class="del" onclick="deleteCourse(${index})">Delete</button>
          </div>
        `;
      }).join('');
    }
  }
}

document.getElementById('saveCourseBtn').addEventListener('click', () => {
  const name = document.getElementById('co-name').value.trim();
  const rating = document.getElementById('co-rating').value;
  const slope = document.getElementById('co-slope').value;
  const apiId = document.getElementById('co-api-id').value;

  if (!name) {
    alert('Please enter a course name.');
    return;
  }

  // Read pars and yards from the active scorecard inputs
  const pars = [];
  const yards = [];
  for (let i = 1; i <= 18; i++) {
    const parVal = parseInt(document.getElementById(`par_${i}`)?.value, 10);
    const ydVal = parseInt(document.getElementById(`yd_${i}`)?.value, 10);
    pars.push(isNaN(parVal) ? 4 : parVal);
    yards.push(isNaN(ydVal) ? 0 : ydVal);
  }

  const newCourse = { 
    name, rating, slope, apiId, pars, yards, coords: currentLoadedGreenCoords, id: Date.now() 
  };
  
  savedCourses.push(newCourse);
  localStorage.setItem('adairway_courses', JSON.stringify(savedCourses));

  // Clear inputs
  document.getElementById('co-name').value = '';
  document.getElementById('co-rating').value = '';
  document.getElementById('co-slope').value = '';
  document.getElementById('co-api-id').value = '';

  updateCourseDropdowns();
  alert('Course saved successfully with hole pars, distances, and GPS data!');
});

window.deleteCourse = function(index) {
  savedCourses.splice(index, 1);
  localStorage.setItem('adairway_courses', JSON.stringify(savedCourses));
  updateCourseDropdowns();
};

// Dropdown Change Listeners

// ---------- OPENGOLFAPI INTEGRATION ----------
// API shape (api/v1):
//   search → { courses: [{ id, course_name, city, state, ... }] }
//   course → { id, course_name, tees: [{ tee_name, tee_color, course_rating, slope, yardage }],
//              holes_data: [{ number, par, yardages: { white, blue, ... }, green: { center } }] }
//   features?course=&hole=&type=green → { features: [{ center: { lat, lng } }] }

document.getElementById('apiSearchBtn').addEventListener('click', async () => {
  const query = document.getElementById('apiSearchInput').value.trim();
  const resultsDiv = document.getElementById('apiSearchResults');
  if (!query) return;

  resultsDiv.innerHTML = '<div style="font-size:12px; color:var(--turf);">Searching courses...</div>';
  try {
    const res = await fetch(`${OGA_BASE}/api/v1/courses/search?q=${encodeURIComponent(query)}`);
    if (!res.ok) throw new Error('search failed');
    const data = await res.json();
    const courses = data.courses || data.results || (Array.isArray(data) ? data : []);

    if (!courses.length) {
      resultsDiv.innerHTML = '<div style="font-size:12px; color:var(--flag);">No courses found.</div>';
      return;
    }

    resultsDiv.innerHTML = courses.map(c => {
      const id = c.id || c.course_id;
      const cName = c.course_name || c.name || c.club_name || 'Golf Course';
      const loc = [c.city, c.state].filter(Boolean).join(', ');
      const parInfo = c.par ? ` · Par ${c.par}` : '';
      return `
        <div class="api-result-item">
          <div>
            <strong>${cName}</strong><br>
            <small>${loc}${parInfo}</small>
          </div>
          <button class="btn small" onclick="applyApiCourse('${id}')">Use This</button>
        </div>
      `;
    }).join('');
  } catch (err) {
    resultsDiv.innerHTML = '<div style="font-size:12px; color:var(--flag);">Error connecting to OpenGolfAPI.</div>';
  }
});

/** Pick a representative yardage from the per-color yardages object. Prefer white, then blue, gold, then first numeric. */
function pickYardage(yardages, preferredColor) {
  if (!yardages || typeof yardages !== 'object') return 0;
  const prefer = (preferredColor || 'white').toLowerCase();
  const order = [prefer, 'white', 'blue', 'gold', 'black', 'championship', 'green', 'red', 'yellow', 'web'];
  for (const key of order) {
    const v = yardages[key];
    if (v != null && !isNaN(parseInt(v, 10)) && parseInt(v, 10) > 0) return parseInt(v, 10);
  }
  for (const v of Object.values(yardages)) {
    const n = parseInt(v, 10);
    if (!isNaN(n) && n > 0) return n;
  }
  return 0;
}

/** Extract green center {lat, lon} from a holes_data entry if present. */
function greenCoordsFromHole(h) {
  if (!h) return null;
  if (h.green && h.green.center && h.green.center.lat != null && (h.green.center.lng != null || h.green.center.lon != null)) {
    return { lat: parseFloat(h.green.center.lat), lon: parseFloat(h.green.center.lng ?? h.green.center.lon) };
  }
  if (h.green && h.green.lat != null && (h.green.lng != null || h.green.lon != null)) {
    return { lat: parseFloat(h.green.lat), lon: parseFloat(h.green.lng ?? h.green.lon) };
  }
  if (h.latitude != null && h.longitude != null) {
    return { lat: parseFloat(h.latitude), lon: parseFloat(h.longitude) };
  }
  return null;
}

async function fetchGreenCoordsForCourse(courseId) {
  const coords = Array(18).fill(null);
  // Batch: try features for each hole in parallel (rate-limit friendly — 18 is fine)
  const tasks = [];
  for (let hole = 1; hole <= 18; hole++) {
    tasks.push(
      fetch(`${OGA_BASE}/api/v1/features?course=${encodeURIComponent(courseId)}&hole=${hole}&type=green`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (!data) return;
          const features = data.features || (Array.isArray(data) ? data : []);
          const feat = features[0];
          if (!feat) return;
          if (feat.center && feat.center.lat != null) {
            coords[hole - 1] = { lat: parseFloat(feat.center.lat), lon: parseFloat(feat.center.lng ?? feat.center.lon) };
          } else if (feat.coordinates && Array.isArray(feat.coordinates)) {
            // GeoJSON point [lon, lat] or nested polygon — prefer center if present
            const c = feat.coordinates;
            if (typeof c[0] === 'number') {
              coords[hole - 1] = { lat: parseFloat(c[1]), lon: parseFloat(c[0]) };
            }
          }
        })
        .catch(() => {})
    );
  }
  await Promise.all(tasks);
  return coords;
}

window.applyApiCourse = async function(courseId) {
  try {
    const res = await fetch(`${OGA_BASE}/api/v1/courses/${courseId}`);
    if (!res.ok) throw new Error('course fetch failed');
    const courseData = await res.json();

    const courseName = courseData.course_name || courseData.name || courseData.club_name || 'Golf Course';

    // Prefer White male tee for rating/slope, else first tee
    const tees = Array.isArray(courseData.tees) ? courseData.tees : [];
    const preferredTee =
      tees.find(t => (t.tee_name || t.name || '').toLowerCase() === 'white' && (t.gender || '').toLowerCase() === 'male') ||
      tees.find(t => (t.tee_name || t.name || '').toLowerCase() === 'white') ||
      tees.find(t => (t.tee_color || '').toLowerCase() === 'white') ||
      tees[0];
    const teeColor = (preferredTee && (preferredTee.tee_color || preferredTee.tee_name || preferredTee.name) || 'white').toLowerCase();

    document.getElementById('co-name').value = courseName;
    document.getElementById('co-rating').value =
      (preferredTee && (preferredTee.course_rating ?? preferredTee.rating)) ??
      courseData.rating ?? courseData.course_rating ?? '';
    document.getElementById('co-slope').value =
      (preferredTee && preferredTee.slope) ??
      courseData.slope ?? courseData.slope_rating ?? '';
    document.getElementById('co-api-id').value = courseData.id || courseId;
    activeCourseApiId = courseData.id || courseId;

    // Also fill Play / Rounds course name fields for convenience
    const rCourse = document.getElementById('r-course');
    const plCourse = document.getElementById('pl-course');
    if (rCourse) rCourse.value = courseName;
    if (plCourse) plCourse.value = courseName;
    if (preferredTee) {
      const teeLabel = preferredTee.tee_name || preferredTee.name || preferredTee.tee_color || '';
      const rTees = document.getElementById('r-tees');
      const plTees = document.getElementById('pl-tees');
      if (rTees) rTees.value = teeLabel;
      if (plTees) plTees.value = teeLabel;
    }

    let extractedPars = Array(18).fill(4);
    let extractedYards = Array(18).fill(0);
    let extractedCoords = Array(18).fill(null);

    // Primary source: holes_data (not "holes", which is just the hole count integer)
    let rawHoles = courseData.holes_data;
    if (!Array.isArray(rawHoles) || rawHoles.length === 0) {
      // Fallback dedicated holes endpoint
      try {
        const holeRes = await fetch(`${OGA_BASE}/api/v1/courses/${courseId}/holes`);
        if (holeRes.ok) {
          const holeData = await holeRes.json();
          rawHoles = holeData.holes || holeData.holes_data || holeData;
        }
      } catch (e) {}
    }
    // Legacy scorecard (par only) from /v1 style
    if ((!Array.isArray(rawHoles) || rawHoles.length === 0) && Array.isArray(courseData.scorecard)) {
      rawHoles = courseData.scorecard;
    }

    if (Array.isArray(rawHoles)) {
      rawHoles.forEach(h => {
        const num = (h.number ?? h.hole_number ?? h.hole) - 1;
        if (num < 0 || num >= 18) return;
        if (h.par != null) extractedPars[num] = parseInt(h.par, 10) || 4;
        // yardages is an object keyed by tee color
        if (h.yardages && typeof h.yardages === 'object') {
          extractedYards[num] = pickYardage(h.yardages, teeColor);
        } else {
          const d = h.length || h.yardage || h.yards || h.distance;
          if (d) extractedYards[num] = parseInt(d, 10) || 0;
        }
        const gc = greenCoordsFromHole(h);
        if (gc) extractedCoords[num] = gc;
      });
    }

    // Fill missing green GPS from OSM features endpoint
    const missingGps = extractedCoords.some(c => !c);
    if (missingGps) {
      try {
        const featureCoords = await fetchGreenCoordsForCourse(courseId);
        for (let i = 0; i < 18; i++) {
          if (!extractedCoords[i] && featureCoords[i]) extractedCoords[i] = featureCoords[i];
        }
      } catch (e) {}
    }

    applyScorecardData(extractedPars, extractedYards, extractedCoords);

    const gpsCount = extractedCoords.filter(Boolean).length;
    const yardCount = extractedYards.filter(y => y > 0).length;
    alert(`Loaded ${courseName}!\nPars: ${extractedPars.filter(p => p).length} holes\nYardages (${teeColor}): ${yardCount} holes\nGreen GPS: ${gpsCount}/18`);
  } catch (err) {
    console.error(err);
    alert('Failed to load course details. Check your network connection.');
  }
};

// ---------- GPS DISTANCE CALCULATOR ----------
function distanceYards(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;

  const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
    Math.cos(φ1) * Math.cos(φ2) *
    Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  const meters = R * c;
  return Math.round(meters * 1.09361);
}

document.getElementById('gpsBtn').addEventListener('click', () => {
  const display = document.getElementById('gpsDisplay');
  if (!navigator.geolocation) {
    display.textContent = 'GPS Not Supported';
    return;
  }

  display.textContent = 'Locating...';

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const userLat = pos.coords.latitude;
    const userLon = pos.coords.longitude;

    // 1) Cached green coords from course load / save
    const preLoaded = currentLoadedGreenCoords[currentPlayHole - 1];
    if (preLoaded && preLoaded.lat != null && preLoaded.lon != null) {
      display.textContent = `${distanceYards(userLat, userLon, preLoaded.lat, preLoaded.lon)} yds`;
      return;
    }

    // 2) Live fetch from features API
    if (activeCourseApiId) {
      try {
        const res = await fetch(
          `${OGA_BASE}/api/v1/features?course=${encodeURIComponent(activeCourseApiId)}&hole=${currentPlayHole}&type=green`
        );
        if (res.ok) {
          const data = await res.json();
          const features = data.features || (Array.isArray(data) ? data : []);
          const feat = features[0];
          if (feat) {
            let greenLat, greenLon;
            if (feat.center && feat.center.lat != null) {
              greenLat = parseFloat(feat.center.lat);
              greenLon = parseFloat(feat.center.lng ?? feat.center.lon);
            } else if (feat.coordinates && typeof feat.coordinates[0] === 'number') {
              greenLon = parseFloat(feat.coordinates[0]);
              greenLat = parseFloat(feat.coordinates[1]);
            }
            if (greenLat != null && greenLon != null) {
              // Cache for this session
              currentLoadedGreenCoords[currentPlayHole - 1] = { lat: greenLat, lon: greenLon };
              display.textContent = `${distanceYards(userLat, userLon, greenLat, greenLon)} yds`;
              return;
            }
          }
        }
      } catch (e) {}
    }

    display.textContent = 'No GPS data for this hole';
  }, () => {
    display.textContent = 'GPS Error';
  }, { enableHighAccuracy: true, timeout: 12000 });
});

    for (let i = 10; i <= 18; i++) headerHTML += `<th>${i}</th>`;
    headerHTML += '<th>IN</th>';
  }
  headerHTML += '<th>TOT</th></tr></thead>';

  let bodyHTML = '<tbody>';
  
  // PAR ROW
  bodyHTML += '<tr><td class="rowlabel">PAR</td>';
  for (let i = 1; i <= 9; i++) bodyHTML += `<td class="front9"><input type="number" id="par_${i}" value="${currentLoadedPars[i-1] || 4}" min="3" max="5"></td>`;
  bodyHTML += '<td class="total" id="par_out">36</td>';

  // YARDS ROW
  bodyHTML += '<tr><td class="rowlabel">YARDS</td>';
  for (let i = 1; i <= 9; i++) bodyHTML += `<td class="front9"><input type="number" id="yd_${i}" value="${currentLoadedYards[i-1] || 0}" min="0"></td>`;
  bodyHTML += '<td class="total" id="yd_out">0</td>';
  if (is18) {
    for (let i = 10; i <= 18; i++) bodyHTML += `<td class="back9"><input type="number" id="yd_${i}" value="${currentLoadedYards[i-1] || 0}" min="0"></td>`;
    bodyHTML += '<td class="total" id="yd_in">0</td>';

  bodyHTML += '<td class="total" id="score_tot">0</td></tr>';

  for (let i = 1; i <= 9; i++) bodyHTML += `<td class="front9"><input type="number" id="putts_${i}" min="0"></td>`;
  bodyHTML += '<td class="total" id="putts_out">0</td>';
  if (is18) {
    for (let i = 10; i <= 18; i++) bodyHTML += `<td class="back9"><input type="number" id="putts_${i}" min="0"></td>`;
    bodyHTML += '<td class="total" id="putts_in">0</td>';
  }
  bodyHTML += '<td class="total" id="putts_tot">0</td></tr>';

  // FIR ROW
  bodyHTML += '<tr><td class="rowlabel">FIR</td>';
  for (let i = 1; i <= 9; i++) bodyHTML += `<td class="front9"><input type="checkbox" id="fir_${i}"></td>`;
  bodyHTML += '<td class="total" id="fir_out">0</td>';
  if (is18) {
    for (let i = 10; i <= 18; i++) bodyHTML += `<td class="back9"><input type="checkbox" id="fir_${i}"></td>`;
    bodyHTML += '<td class="total" id="fir_in">0</td>';
  }
  bodyHTML += '<td class="total" id="fir_tot">0</td></tr>';

  // GIR ROW
  bodyHTML += '<tr><td class="rowlabel">GIR</td>';
  for (let i = 1; i <= 9; i++) bodyHTML += `<td class="front9"><input type="checkbox" id="gir_${i}"></td>`;
  bodyHTML += '<td class="total" id="gir_out">0</td>';
  if (is18) {
    for (let i = 10; i <= 18; i++) bodyHTML += `<td class="back9"><input type="checkbox" id="gir_${i}"></td>`;
    bodyHTML += '<td class="total" id="gir_in">0</td>';

function updateTotals() {
  const is18 = parseInt(holesSelect.value, 10) === 18;
  const count = is18 ? 18 : 9;

  let parOut = 0, parIn = 0;
  let ydOut = 0, ydIn = 0;
  let scoreOut = 0, scoreIn = 0;
  let puttsOut = 0, puttsIn = 0;
  let firOut = 0, firIn = 0;
  let girOut = 0, girIn = 0;

  for (let i = 1; i <= count; i++) {
    const p = parseInt(document.getElementById(`par_${i}`)?.value) || 0;
    const y = parseInt(document.getElementById(`yd_${i}`)?.value) || 0;
    const s = parseInt(document.getElementById(`score_${i}`)?.value) || 0;
    const pt = parseInt(document.getElementById(`putts_${i}`)?.value) || 0;
    const f = document.getElementById(`fir_${i}`)?.checked ? 1 : 0;
    const g = document.getElementById(`gir_${i}`)?.checked ? 1 : 0;

    if (i <= 9) {
      parOut += p; ydOut += y; scoreOut += s; puttsOut += pt; firOut += f; girOut += g;
    } else {
      parIn += p; ydIn += y; scoreIn += s; puttsIn += pt; firIn += f; girIn += g;
    }
  }

  document.getElementById('par_out').textContent = parOut;
  document.getElementById('yd_out').textContent = ydOut;
  document.getElementById('score_out').textContent = scoreOut;
  document.getElementById('putts_out').textContent = puttsOut;
  document.getElementById('fir_out').textContent = firOut;
  document.getElementById('gir_out').textContent = girOut;

  if (is18) {
    document.getElementById('par_in').textContent = parIn;
    document.getElementById('yd_in').textContent = ydIn;
    document.getElementById('score_in').textContent = scoreIn;
    document.getElementById('putts_in').textContent = puttsIn;
    document.getElementById('fir_in').textContent = firIn;
    document.getElementById('gir_in').textContent = girIn;
  }

  document.getElementById('par_tot').textContent = parOut + parIn;
  document.getElementById('yd_tot').textContent = ydOut + ydIn;
  document.getElementById('score_tot').textContent = scoreOut + scoreIn;
  document.getElementById('putts_tot').textContent = puttsOut + puttsIn;
  document.getElementById('fir_tot').textContent = firOut + firIn;
  document.getElementById('gir_tot').textContent = girOut + girIn;
}
