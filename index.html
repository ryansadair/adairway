<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adairway — Golf Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fairway-deep:#1F3A2E;
    --turf:#3F6B4A;
    --paper:#EDE6D6;
    --paper-light:#F5F0E6;
    --graphite:#33312C;
    --flag:#A4402F;
    --sand:#C7A876;
    --sky:#8FA89A;
    --line:#D7CCB0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--graphite);
    font-family:'Inter',sans-serif;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(51,49,44,0.035) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(51,49,44,0.035) 28px);
  }
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;display:none;} /* Hidden by default until authenticated */

  /* Auth UI Styles */
  .auth-card {
    max-width: 420px;
    margin: 60px auto;
    padding: 28px;
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 3px;
    box-shadow: 0 4px 12px rgba(31,58,46,0.08);
  }
  .auth-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .auth-header h2 {
    font-family: 'Fraunces', serif;
    color: var(--fairway-deep);
    margin: 8px 0 4px;
  }
  .auth-btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(31,58,46,0.05);
    padding: 8px 14px;
    border-radius: 3px;
    margin-bottom: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }

  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    border-bottom:3px solid var(--fairway-deep);
    padding-bottom:14px;margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .flagmark{width:34px;height:34px;flex-shrink:0;}
  h1{
    font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:700;font-size:30px;
    letter-spacing:-0.01em;margin:0;color:var(--fairway-deep);
  }
  .tag{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--turf);font-weight:600;}
  .today{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--graphite);opacity:0.7;text-align:right;}

  nav{display:flex;gap:2px;margin-bottom:22px;flex-wrap:wrap;}
  nav button{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:0.04em;
    text-transform:uppercase;background:none;border:none;color:var(--graphite);opacity:0.55;
    padding:9px 14px;cursor:pointer;position:relative;transition:opacity .15s;
  }
  nav button:hover{opacity:0.85;}
  nav button.active{opacity:1;color:var(--fairway-deep);}
  nav button.active::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--flag);}
  nav button .peg{
    display:inline-block;width:16px;height:16px;border-radius:50%;
    background:var(--fairway-deep);color:var(--paper-light);font-size:9px;line-height:16px;text-align:center;margin-right:6px;
  }

  section{display:none;}
  section.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{
    background:var(--paper-light);border:1px solid var(--line);border-radius:3px;
    padding:20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(31,58,46,0.04);
  }
  .card h2{
    font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0 0 14px;color:var(--fairway-deep);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .card h2 small{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:var(--turf);text-transform:none;}

  label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--turf);margin-bottom:4px;}
  input[type=text], input[type=password], input[type=date], input[type=number], textarea, select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:2px;
    background:#fff;font-family:'Inter',sans-serif;font-size:14px;color:var(--graphite);
  }
  input:focus, textarea:focus, select:focus{outline:2px solid var(--sky);outline-offset:0;border-color:var(--turf);}
  input[type=date]{
    -webkit-appearance:none;
    appearance:none;
    text-align:left;
  }
  textarea{resize:vertical;min-height:60px;font-family:'Inter',sans-serif;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .field{margin-bottom:12px;}

  button.btn{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:0.05em;
    background:var(--fairway-deep);color:var(--paper-light);border:none;border-radius:2px;
    padding:10px 18px;cursor:pointer;transition:background .15s;
  }
  button.btn:hover{background:var(--turf);}
  button.btn.small{padding:5px 10px;font-size:11px;}
  button.btn.outline{background:none;color:var(--fairway-deep);border:2px solid var(--fairway-deep);}
  button.btn.outline:hover{background:var(--fairway-deep);color:var(--paper-light);}

  .scorecard{overflow-x:auto;margin-bottom:14px;border:1px solid var(--fairway-deep);border-radius:2px;}
  table.sc{border-collapse:collapse;width:100%;min-width:900px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  table.sc th, table.sc td{border:1px solid var(--line);padding:4px 2px;text-align:center;}
  table.sc th{background:var(--fairway-deep);color:var(--paper-light);font-weight:600;font-size:10.5px;}
  table.sc td.rowlabel{background:var(--sand);color:var(--graphite);font-weight:700;text-align:left;padding-left:8px;width:64px;font-size:10.5px;}
  table.sc td.front9{background:rgba(63,107,74,0.06);}
  table.sc td.back9{background:rgba(164,64,47,0.05);}
  table.sc input[type=number]{
    width:30px;border:none;background:transparent;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:3px 0;
  }
  table.sc input[type=checkbox]{width:15px;height:15px;cursor:pointer;}
  table.sc input[type=checkbox]:disabled{opacity:0.15;cursor:default;}
  table.sc td.total{background:var(--fairway-deep);color:var(--paper-light);font-weight:700;font-size:11.5px;}

  .preset-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;}
  .preset-row .field{flex:1;min-width:220px;margin-bottom:0;}

  .round-item, .list-item{
    border:1px solid var(--line);border-radius:2px;padding:12px 14px;margin-bottom:8px;background:#fff;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  }
  .round-item .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--turf);margin-bottom:3px;}
  .round-item .title{font-weight:600;font-size:14.5px;}
  .round-item .score{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--fairway-deep);}
  .round-item .notes{font-size:13px;color:var(--graphite);opacity:0.8;margin-top:6px;}
  .empty{
    text-align:center;padding:34px 20px;color:var(--turf);font-family:'IBM Plex Mono',monospace;font-size:13px;
    border:1px dashed var(--line);border-radius:3px;
  }

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .stat-box{background:var(--fairway-deep);color:var(--paper-light);border-radius:3px;padding:14px 12px;text-align:center;}
  .stat-box .num{font-family:'Fraunces',serif;font-weight:700;font-size:26px;display:block;}
  .stat-box .lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.8;}

  svg.chart{width:100%;height:180px;display:block;}
  .del{background:none;border:none;color:var(--flag);cursor:pointer;font-size:12px;font-family:'IBM Plex Mono',monospace;padding:2px 6px;}
  .del:hover{text-decoration:underline;}
  .savepill{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--turf);opacity:0;transition:opacity .3s;}
  .savepill.show{opacity:1;}
  .hint{font-size:12px;color:var(--turf);opacity:0.8;margin:-6px 0 14px;font-family:'IBM Plex Mono',monospace;}

  .dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
  .hole-card{text-align:center;padding:8px 0 4px;}
  .hole-card .holenum{font-family:'Fraunces',serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.08em;color:var(--turf);margin-bottom:2px;}
  .hole-card .holepar{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--graphite);opacity:0.7;margin-bottom:18px;}
  .stat-block{margin-bottom:22px;}
  .stat-block .stat-name{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--turf);font-weight:600;margin-bottom:8px;}
  .stepper{display:flex;align-items:center;justify-content:center;gap:22px;}
  .stepper button{
    width:52px;height:52px;border-radius:50%;border:2px solid var(--fairway-deep);background:var(--paper-light);
    color:var(--fairway-deep);font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;user-select:none;
  }
  .stepper button:active{background:var(--fairway-deep);color:var(--paper-light);}
  .stepper .val{font-family:'Fraunces',serif;font-weight:700;font-size:38px;color:var(--graphite);min-width:52px;}
  .toggle-btn{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.04em;
    padding:14px 20px;border-radius:3px;border:2px solid var(--line);background:#fff;color:var(--graphite);
    cursor:pointer;width:100%;transition:all .12s;
  }
  .toggle-btn.on{background:var(--turf);border-color:var(--turf);color:#fff;}
  .toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .play-nav{display:flex;gap:10px;margin-top:18px;}
  .play-nav button{flex:1;}

  @media (max-width: 520px){
    .wrap{padding:16px 14px 70px;}
    header{flex-direction:column;align-items:flex-start;gap:6px;padding-bottom:10px;}
    .today{text-align:left;}
    h1{font-size:26px;}
    .grid3, .grid2{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:1fr 1fr;}
    .preset-row .field{min-width:0;}
    nav{gap:0;margin-bottom:16px;}
    nav button{padding:8px 10px;font-size:11.5px;}
    .stepper{gap:14px;}
    .stepper button{width:46px;height:46px;font-size:22px;}
  }
</style>
</head>
<body>

<!-- AUTH CONTAINER (Shown when logged out) -->
<div id="authContainer" class="auth-card">
  <div class="auth-header">
    <svg class="flagmark" viewBox="0 0 40 40" fill="none" style="margin:0 auto; display:block;">
      <line x1="10" y1="4" x2="10" y2="36" stroke="#1F3A2E" stroke-width="2"/>
      <path d="M10 5 L28 10 L10 15 Z" fill="#A4402F"/>
      <ellipse cx="10" cy="37" rx="7" ry="2" fill="#8FA89A" opacity="0.5"/>
    </svg>
    <h2>Adairway Golf</h2>
    <div style="font-size: 13px; color: var(--turf);">Sign in or create an account</div>
  </div>
  
  <div class="field">
    <label>Email</label>
    <input type="text" id="authEmail" placeholder="golfer@example.com">
  </div>
  
  <div class="field">
    <label>Password</label>
    <input type="password" id="authPassword" placeholder="••••••••">
  </div>
  
  <div id="authError" style="color: var(--flag); font-size: 12px; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; display: none;"></div>

  <div class="auth-btn-row">
    <button class="btn" id="loginBtn" style="flex: 1;">Log In</button>
    <button class="btn outline" id="signupBtn" style="flex: 1;">Create Account</button>
  </div>
</div>

<!-- MAIN APP CONTAINER (Shown when logged in) -->
<div class="wrap">

  <div class="user-bar">
    <span>Logged in as: <strong id="userEmailDisplay">...</strong></span>
    <button class="del" id="logoutBtn">Sign Out</button>
  </div>

  <header>
    <div class="brand">
      <svg class="flagmark" viewBox="0 0 40 40" fill="none">
        <line x1="10" y1="4" x2="10" y2="36" stroke="#1F3A2E" stroke-width="2"/>
        <path d="M10 5 L28 10 L10 15 Z" fill="#A4402F"/>
        <ellipse cx="10" cy="37" rx="7" ry="2" fill="#8FA89A" opacity="0.5"/>
      </svg>
      <div>
        <h1>Adairway</h1>
        <div class="tag">Personal course log</div>
      </div>
    </div>
    <div class="today" id="todayDate"></div>
  </header>

  <nav id="tabs">
    <button data-tab="play"><span class="peg">▶</span>Play</button>
    <button data-tab="rounds" class="active"><span class="peg">1</span>Rounds</button>
    <button data-tab="stats"><span class="peg">2</span>Stats</button>
    <button data-tab="practice"><span class="peg">3</span>Practice</button>
    <button data-tab="bag"><span class="peg">4</span>Bag</button>
    <button data-tab="courses"><span class="peg">5</span>Courses</button>
    <button data-tab="notes"><span class="peg">6</span>Notes</button>
    <button data-tab="backup"><span class="peg">7</span>Backup</button>
  </nav>

  <!-- PLAY -->
  <section id="tab-play">
    <div class="card">
      <h2>Playing now</h2>
      <div class="preset-row">
        <div class="field">
          <label>Quick-load a course</label>
          <select id="pl-preset">
            <option value="">— Select a regular —</option>
          </select>
        </div>
      </div>
      <div class="grid3">
        <div class="field"><label>Date</label><input type="date" id="pl-date"></div>
        <div class="field"><label>Course</label><input type="text" id="pl-course" placeholder="e.g. Pine Ridge Golf Club"></div>
        <div class="field"><label>Tees</label><input type="text" id="pl-tees" placeholder="e.g. White"></div>
      </div>
    </div>

    <div class="card">
      <div class="dots" id="playDots"></div>
      <div class="hole-card">
        <div class="holenum" id="playHoleNum">Hole 1</div>
        <div class="holepar" id="playHolePar">Par 4</div>
      </div>

      <div class="stat-block">
        <div class="stat-name" style="text-align:center;">Score</div>
        <div class="stepper">
          <button id="scoreMinus" type="button">−</button>
          <div class="val" id="scoreVal">4</div>
          <button id="scorePlus" type="button">+</button>
        </div>
      </div>

      <div class="stat-block">
        <div class="stat-name" style="text-align:center;">Putts</div>
        <div class="stepper">
          <button id="puttsMinus" type="button">−</button>
          <div class="val" id="puttsVal">2</div>
          <button id="puttsPlus" type="button">+</button>
        </div>
      </div>

      <div class="stat-block">
        <div class="toggle-row">
          <button class="toggle-btn" id="firToggle" type="button">Fairway hit</button>
          <button class="toggle-btn" id="girToggle" type="button">Green in reg</button>
        </div>
      </div>

      <div class="play-nav">
        <button class="btn outline" id="playPrev" type="button">← Prev</button>
        <button class="btn outline" id="playNext" type="button">Next →</button>
      </div>
    </div>

    <div class="card">
      <div class="field"><label>Notes</label><textarea id="pl-notes" placeholder="Anything worth remembering..."></textarea></div>
      <button class="btn" id="finishRoundBtn" style="width:100%;">Finish &amp; save round</button>
    </div>
  </section>

  <!-- ROUNDS -->
  <section id="tab-rounds" class="active">
    <div class="card">
      <h2>New round <small id="roundSavePill" class="savepill">saved</small></h2>
      <div class="preset-row">
        <div class="field">
          <label>Quick-load a course</label>
          <select id="r-preset">
            <option value="">— Select a regular —</option>
          </select>
        </div>
      </div>
      <div class="grid3">
        <div class="field"><label>Date</label><input type="date" id="r-date"></div>
        <div class="field"><label>Course</label><input type="text" id="r-course" placeholder="e.g. Pine Ridge Golf Club"></div>
        <div class="field"><label>Tees</label><input type="text" id="r-tees" placeholder="e.g. White, 5,695 yds"></div>
      </div>
      <div class="scorecard">
        <table class="sc" id="scorecardTable"></table>
      </div>
      <div class="field"><label>Notes</label><textarea id="r-notes" placeholder="Ball striking, misses, mental game..."></textarea></div>
      <button class="btn" id="saveRoundBtn">Save round</button>
    </div>

    <div class="card">
      <h2>Round history</h2>
      <div id="roundsList"></div>
    </div>
  </section>

  <!-- STATS -->
  <section id="tab-stats">
    <div class="card">
      <h2>Season at a glance</h2>
      <div class="stat-row" id="statBoxes"></div>
    </div>
  </section>

  <!-- PRACTICE -->
  <section id="tab-practice">
    <div class="card">
      <h2>Log practice session</h2>
      <div class="grid3">
        <div class="field"><label>Date</label><input type="date" id="p-date"></div>
        <div class="field"><label>Focus area</label><input type="text" id="p-focus" placeholder="e.g. Putting"></div>
        <div class="field"><label>Duration (min)</label><input type="number" id="p-duration" min="0"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="p-notes"></textarea></div>
      <button class="btn" id="savePracticeBtn">Save session</button>
    </div>
  </section>

  <!-- BAG -->
  <section id="tab-bag">
    <div class="card">
      <h2>Add a club</h2>
      <div class="grid3">
        <div class="field"><label>Club</label><input type="text" id="c-name"></div>
        <div class="field"><label>Brand / Model</label><input type="text" id="c-model"></div>
        <div class="field"><label>Shaft</label><input type="text" id="c-shaft"></div>
      </div>
      <button class="btn" id="saveClubBtn">Add club</button>
    </div>
  </section>

  <!-- COURSES -->
  <section id="tab-courses">
    <div class="card">
      <h2>Add course notes</h2>
      <div class="field"><label>Course name</label><input type="text" id="co-name"></div>
      <button class="btn" id="saveCourseBtn">Save course</button>
    </div>
  </section>

  <!-- NOTES -->
  <section id="tab-notes">
    <div class="card">
      <h2>Journal entry</h2>
      <div class="field"><label>Date</label><input type="date" id="n-date"></div>
      <div class="field"><label>Thought</label><textarea id="n-text"></textarea></div>
      <button class="btn" id="saveNoteBtn">Add entry</button>
    </div>
  </section>

  <!-- BACKUP -->
  <section id="tab-backup">
    <div class="card">
      <h2>Export / Restore</h2>
      <button class="btn" id="exportBtn">Download backup (.json)</button>
    </div>
  </section>

</div>

<script>
// ---------- Utilities & Setup ----------
const todayISO = () => new Date().toISOString().slice(0,10);
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
document.getElementById('r-date').value = todayISO();
document.getElementById('p-date').value = todayISO();
document.getElementById('n-date').value = todayISO();
document.getElementById('pl-date').value = todayISO();

// ---------- Navigation Tabs ----------
document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
});
</script>

<!-- FIREBASE AUTH INTEGRATION -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    onAuthStateChanged, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // Replace these credentials with your actual project details from Firebase Console
  const firebaseConfig = {
    apiKey: "AIzaSyBHKyis-dDknrvOuojryQnIsVcRkEPR5bQ",
    authDomain: "adairway-golf.firebaseapp.com",
    projectId: "adairway-golf",
    storageBucket: "adairway-golf.firebasestorage.app",
    messagingSenderId: "109030250059",
    appId: "1:109030250059:web:fb3a3684e4b474cb491fce",
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // UI Elements
  const authContainer = document.getElementById('authContainer');
  const appWrap = document.querySelector('.wrap');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authError = document.getElementById('authError');
  const userEmailDisplay = document.getElementById('userEmailDisplay');

  // CREATE ACCOUNT
  document.getElementById('signupBtn').addEventListener('click', async () => {
    authError.style.display = 'none';
    try {
      await createUserWithEmailAndPassword(auth, authEmail.value, authPassword.value);
    } catch (error) {
      authError.textContent = error.message;
      authError.style.display = 'block';
    }
  });

  // LOG IN
  document.getElementById('loginBtn').addEventListener('click', async () => {
    authError.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, authEmail.value, authPassword.value);
    } catch (error) {
      authError.textContent = error.message;
      authError.style.display = 'block';
    }
  });

  // LOG OUT
  document.getElementById('logoutBtn').addEventListener('click', () => {
    signOut(auth);
  });

  // AUTH STATE MONITOR
  onAuthStateChanged(auth, (user) => {
    if (user) {
      authContainer.style.display = 'none';
      appWrap.style.display = 'block';
      userEmailDisplay.textContent = user.email;
    } else {
      authContainer.style.display = 'block';
      appWrap.style.display = 'none';
      authEmail.value = '';
      authPassword.value = '';
    }
  });
</script>

</body>
</html>
